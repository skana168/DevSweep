[package]
name = "devsweep"
default-run = "devsweep"
version = "0.4.0"
edition = "2024"
description = "Find and clean development caches"
license = "MIT"

[build-dependencies]
embed-resource = "3"

[features]
gpui = ["dep:gpui-kit"]
gpui-tests = ["gpui", "gpui-kit/test-support"]

[[bin]]
name = "devsweep-gpui"
path = "src/bin/devsweep-gpui.rs"
required-features = ["gpui"]

[dependencies]
gpui-kit = { version = "=0.7.0", optional = true }
directories = "6.0.0"
eframe = "0.37"
egui_extras = "0.37"
egui_icons = "0.0.1"
opener = "0.9.0"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
sys-locale = "0.3"
toml = "1.1.8"
trash = "5"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

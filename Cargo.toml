[package]
name = "devsweep"
version = "0.4.0"
edition = "2024"
description = "Find and clean development caches"
license = "MIT"
default-run = "devsweep"

[build-dependencies]
embed-resource = "3"

[dependencies]
directories = "6.0.0"
gpui-kit = "0.9.0"
egui_icons = "0.0.1"
opener = "0.9.0"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
sys-locale = "0.3"
toml = "1.1.8"
trash = "5"
walkdir = "2"

[dev-dependencies]
gpui-kit = { version = "0.9.0", features = ["test-support"] }
tempfile = "3"


[[test]]
name = "gpui_window"
path = "tests/gpui_window.rs"
harness = false

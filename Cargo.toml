[package]
name = "devsweep"
version = "0.1.0"
edition = "2024"
description = "Find and clean development caches"
license = "MIT"

[build-dependencies]
embed-resource = "3"

[dependencies]
directories = "6.0.0"
eframe = "0.37"
opener = "0.9.0"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
sys-locale = "0.3"
toml = "1.1.8"
trash = "5"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
